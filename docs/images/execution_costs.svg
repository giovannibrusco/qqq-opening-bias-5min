<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cumulative P&amp;L across three QQQ opening-bias scenarios</title>
  <desc id="desc">The no-cost replication generated 139127 dollars, static slippage generated 5068 dollars, and static slippage plus NQ confirmation generated 45317 dollars.</desc>
  <rect width="1200" height="630" fill="#ffffff"/>
  <text x="70" y="72" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">Execution assumptions change the result</text>
  <text x="70" y="112" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4b5563">QQQ opening-bias replication, January 2016 to February 2023</text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="310" y1="145" x2="310" y2="510"/>
    <line x1="505" y1="145" x2="505" y2="510"/>
    <line x1="700" y1="145" x2="700" y2="510"/>
    <line x1="895" y1="145" x2="895" y2="510"/>
    <line x1="1090" y1="145" x2="1090" y2="510"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">
    <text x="310" y="540">$0</text>
    <text x="505" y="540">$35k</text>
    <text x="700" y="540">$70k</text>
    <text x="895" y="540">$105k</text>
    <text x="1090" y="540">$140k</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111827" text-anchor="end">
    <text x="285" y="208">Before costs</text>
    <text x="285" y="328">Static slippage</text>
    <text x="285" y="448">Slippage + NQ filter</text>
  </g>

  <rect x="310" y="170" width="775" height="58" rx="8" fill="#2563eb"/>
  <rect x="310" y="290" width="28" height="58" rx="8" fill="#f59e0b"/>
  <rect x="310" y="410" width="253" height="58" rx="8" fill="#0f766e"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">
    <text x="1065" y="207" fill="#ffffff" text-anchor="end">$139,127</text>
    <text x="354" y="327" fill="#92400e">$5,068</text>
    <text x="548" y="447" fill="#ffffff" text-anchor="end">$45,317</text>
  </g>

  <text x="70" y="592" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b7280">Historical simulation with $25,000 initial equity, 1% risk per trade and a 4x notional cap. Slippage scenario excludes commissions and market impact.</text>
</svg>
